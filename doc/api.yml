openapi: 3.0.1
info:
  title: StoredInt API
  version: 1.0.0

paths:
  /stored-int:
    get:
      operationId: getStoredInt
      summary: Retourne un entier stocké (ou en crée un)
      responses:
        '200':
          description: Nombre retourné avec succès
          content:
            application/json:
              schema:
                type: object
                properties:
                  storedInt:
                    type: string
        '500':
          description: Erreur interne
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
